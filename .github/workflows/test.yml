name: Test Workflow

permissions:
  packages: write

on:
  pull_request:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/FopefoluwaIkufisile/learnghcr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
